[build-system]
requires = ["setuptools>=80.10.2,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "anything2telegram"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139.2,<1",
  "uvicorn>=0.51.0,<1",
  "pyee>=13.0.1,<14",
  "telethon>=1.44.0,<2",
  "cryptg>=0.4,<1",
  "python-dotenv>=1.2.2,<2",
  "python-multipart>=0.0.32,<1",
  "rich>=14,<15",
  "yt-dlp>=2025.12.8,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "httpx>=0.28.1,<1",
]

[tool.setuptools.packages.find]
include = ["anything2telegram*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
