<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>anything2telegram</title>
<link rel="stylesheet" href="/web/static/vendor/pico-2.1.1.classless.min.css">
<script src="/web/static/vendor/htmx-2.0.9.min.js"></script>
<style>
  .two-col { display: grid; gap: 1.5rem; grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .queue-child td:first-child { padding-left: 2rem; }
  .toggle { display: inline-block; width: 1em; text-align: center; }
  .failed { color: var(--pico-del-color); border-bottom: 1px dotted currentColor; cursor: help; }
</style>
</head>
<body>
<main>
  <article>
    <header><strong>Queue work</strong></header>
    <div class="two-col">
      <form hx-post="/web/youtube{% if open_param %}?open={{ open_param }}{% endif %}" hx-target="#queue" hx-swap="outerHTML">
        <label>YouTube URL
          <input type="url" name="url" placeholder="https://youtu.be/… or /playlist?list=…" required>
        </label>
        <label>Playlist start at #
          <input type="number" name="offset" min="1" value="1">
        </label>
        <button type="submit">Queue</button>
      </form>
      <form hx-post="/web/upload{% if open_param %}?open={{ open_param }}{% endif %}" hx-encoding="multipart/form-data" hx-target="#queue" hx-swap="outerHTML" enctype="multipart/form-data">
        <label>Local file <input type="file" name="file" required></label>
        <progress class="up-progress" value="0" max="100" hidden></progress>
        <button type="submit">Upload</button>
      </form>
    </div>
  </article>
  <div id="flash"></div>
  {% include "queue.html" %}
</main>
<script>
  document.body.addEventListener('htmx:xhr:progress', (e) => {
    const bar = e.target.querySelector('.up-progress');
    if (bar && e.detail.lengthComputable) {
      bar.hidden = false;
      bar.value = (e.detail.loaded / e.detail.total) * 100;
    }
  });
  // Delegated so it keeps working after htmx swaps #queue's rows back in.
  document.body.addEventListener('click', (e) => {
    const button = e.target.closest('.copy');
    if (button) {
      navigator.clipboard.writeText(button.dataset.url);
    }
  });
</script>
</body>
</html>
